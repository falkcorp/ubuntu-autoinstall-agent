# PS-GATE-15 merge-blocking equality gate fixture for unimatrixone (U1,
# NativeKeystore / D2-B). Hand-authored `HostGroupProfile` defaults +
# `HostProfile` overrides that must resolve, through
# `uaa_core::profile::merge::merge`, to the SAME `InstallationConfig` as the
# committed `examples/configs/install/unimatrixone.yaml` (canonical-
# serialization equality — see `component_equality_gate.rs`).
#
# unimatrixone is a standalone group (no sibling hosts), so every value lives
# in the host overrides, exactly as the committed file authors them flat.
#
# `unlock_policy.tpm2_clevis_peer` is authored HERE (nested component, NOT a
# flat field) deliberately, to prove it is accepted by the authoring schema
# but dropped by `lower()` — it MUST NOT appear in the resolved
# `InstallationConfig` (`InstallationConfig` has no such field at all; the
# D2-B clevis TPM2 peer share is derived by the installer from
# `storage_mode == NativeKeystore`, not from any profile input — see
# `profile/components/unlock_policy.rs` and `profile/lower.rs`'s module
# docs). Every other unlock field here (`tang_servers`, `tang_threshold`,
# `enroll_tpm2`, `tpm2_pcr_ids`, `expect_fido2`) stays a FLAT override, so
# `lower()`'s per-leaf fallback (nested leaf absent -> flat field) is what
# actually supplies them — this fixture exercises that fallback path, not a
# fully-nested `unlock_policy`.
#
# Geometry/`reset_enabled` byte-identity is NOT asserted here — see the test
# file's module doc for why.

group:
  name: unimatrixone
  hostname_pattern: unimatrixone
  is_standalone: true
  defaults: {}
  applications: []

host:
  group_name: unimatrixone
  identity: "ac:1f:6b:40:fc:e2"
  hostname_override: unimatrixone
  overrides:
    timezone: America/New_York
    storage_mode: native-keystore
    disks:
      - id: REPLACE_AT_PLACE_TIME_SYSTEM_SSD_0
        role: system
      - id: REPLACE_AT_PLACE_TIME_SYSTEM_SSD_1
        role: system
      - id: REPLACE_AT_PLACE_TIME_SPECIAL_OPTANE_0
        role: special
      - id: REPLACE_AT_PLACE_TIME_SPECIAL_OPTANE_1
        role: special
    disk_device: REPLACE_AT_PLACE_TIME
    luks_key: REPLACE_AT_PLACE_TIME
    root_password: REPLACE_AT_PLACE_TIME
    install_ca_cert: REPLACE_AT_PLACE_TIME
    network_interface: REPLACE_AT_PLACE_TIME
    network_address: REPLACE_AT_PLACE_TIME
    network_gateway: REPLACE_AT_PLACE_TIME
    network_search: jf.local
    network_nameservers:
      - 172.16.2.1
      - 1.1.1.1
      - 8.8.8.8
    debootstrap_release: resolute
    debootstrap_mirror: http://archive.ubuntu.com/ubuntu/
    initramfs_type: dracut
    tang_servers:
      - url: http://172.16.2.45
      - url: http://172.16.2.46
      - url: http://172.16.2.47
    tang_threshold: 2
    ssh_authorized_keys:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOq0x6/0fA+vn0EdNJvBuadOo4rZ1IwkCWbBOWCwvId5 jdfalk@Norn.lan"
    enroll_tpm2: false
    tpm2_pcr_ids: "7"
    expect_fido2: false
    # Authoring/validate-only nested leaf — see the header comment. Every
    # other unlock leaf is deliberately left absent here so `lower()` falls
    # back to the flat fields above.
    unlock_policy:
      tpm2_clevis_peer: true
  applications: []
