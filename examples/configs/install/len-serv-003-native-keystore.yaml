# file: examples/configs/install/len-serv-003-native-keystore.yaml
# version: 1.0.0
# guid: c47f8a15-6b93-4e02-8d5a-9f1e3c74b0d8
# last-edited: 2026-07-29
#
# len-serv-003 migrated from PlainLuks (LUKS *under* ZFS) to **NativeKeystore**
# (ZFS *native* encryption, key held in a LUKS keystore zvol, clevis/Tang D2-B
# unlock) — the same architecture U1 runs, minus the redundancy U1 gets from
# four drives.
#
# This is a NEW file, deliberately not an edit of len-serv-003.yaml: that file
# is the committed PlainLuks reference and is covered by the byte-identity gate
# (component fixture <-> committed config) for all five hosts. Swapping the
# host's storage mode in place would churn that gate in the same change that
# introduces the new layout. Review this, then retire the old one.
#
# HARDWARE (inspected on the live host 2026-07-29, pre-wipe):
#   single 238.5G NVMe (WDC PC SN730)      -> one `system` disk, no mirror
#   NIC enp1s0f0, 172.16.3.96/23, gw .2.1
#   TPM2 v2 present, UEFI, boots NVMe natively (no SATA-boot workaround as on U1)
#
# SECRETS: every REPLACE_AT_PLACE_TIME token must be substituted at place time.
# `validate_config_secrets` fails closed on any that survive, so an unsubstituted
# config cannot reach a disk. Never commit real values.

hostname: len-serv-003
timezone: America/New_York

storage_mode: native-keystore
# SINGLE-disk roster: one `system` disk (ESP + bpool + rpool data), and NO
# `special` entries at all. This is the shape the installer only learned to
# accept with the single-disk change — `plan_layout` previously demanded >=2
# system AND >=2 special disks. bpool/rpool are therefore built as single
# (unmirrored) vdevs; there is no redundancy on this host, by design.
# A LONE `special` disk is rejected on purpose, so do not add one here.
#
# Real by-id serial injected at place-time (same convention as unimatrixone.yaml
# — fleet disk serials are not committed). The live host reports its NVMe under
# /dev/disk/by-id/nvme-WDC_PC_SN730_... ; use the full by-id path, never
# /dev/nvme0n1: NativeKeystore appends `-partN`, which only exists for by-id.
disks:
  - id: REPLACE_AT_PLACE_TIME_SYSTEM_NVME_0
    role: system

# Required by the schema but IGNORED under native-keystore (the `disks` roster
# drives partitioning). Placeholder — injected at place-time.
disk_device: REPLACE_AT_PLACE_TIME

# --- secrets: injected per-host at place-time ---
# luks_key here is the KEYSTORE-ZVOL passphrase (the break-glass path). Clevis
# is the unattended path; this is what you type at the console if Tang is down.
luks_key: REPLACE_AT_PLACE_TIME
# May instead be set to the literal sentinel `!random` to have the installer
# generate a strong per-host password and record it 0600 on the driver host
# (see changelog.d/random-generated-operator-passwords.md). Left as a
# place-time token here so behaviour matches the rest of the fleet.
root_password: REPLACE_AT_PLACE_TIME

# Same install CA for every host; filled in automatically by `uaa config place`
# from /var/lib/uaa/ca/ca.crt. Unsubstituted, it fails closed.
install_ca_cert: REPLACE_AT_PLACE_TIME

network_interface: enp1s0f0
network_address: 172.16.3.96/23
network_gateway: 172.16.2.1
network_search: jf.local
network_nameservers:
  - 172.16.2.1
  - 1.1.1.1
  - 8.8.8.8

debootstrap_release: resolute
debootstrap_mirror: http://archive.ubuntu.com/ubuntu/
initramfs_type: dracut

# clevis Tang SSS: 2-of-3 must respond to auto-unlock on-LAN. Under
# native-keystore this is not merely the preferred path, it is the ONLY
# automatic one — the installer writes an empty crypttab and the
# 91uaa-keystore-wait dracut hook performs the unlock.
tang_servers:
  - url: http://172.16.2.45
  - url: http://172.16.2.46
  - url: http://172.16.2.47
tang_threshold: 2

ssh_authorized_keys:
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOq0x6/0fA+vn0EdNJvBuadOo4rZ1IwkCWbBOWCwvId5 jdfalk@Norn.lan"
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIP4PPvBh1cCMdh8S5Uqz/1cONHxhc78TfWLt0fx76B/G jdfalk@JohnathsMacBook.jf.local"
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPghsb0DAzQX5LfLgb1Q11LJJhppTM1r093TWCTjxjdb eddsa-key-20220820"
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOjWe+a1f8A+R1iqXPR0IiJmPiiIEk3CQxqy3wTMMY4l jdfalk@unimatrixzero"

# D2-B decision 5 (carried over from unimatrixone.yaml, and the reason these
# differ from the old PlainLuks len-serv-003.yaml which set both to true):
# NO systemd-tpm2 / systemd-fido2 tokens — they HANG the boot and can never be
# unattended. The host's TPM2 still participates, but as the *clevis* tpm2 pin
# added by the native-keystore bind, which is a different mechanism.
enroll_tpm2: false
tpm2_pcr_ids: "7"
expect_fido2: false

# ---------------------------------------------------------------------------
# Applications
# ---------------------------------------------------------------------------
# Attached at the HOST tier, deliberately NOT on the len-serv group.
#
# len-serv-001/002 are in-service CockroachDB nodes under a hard
# "byte-identical placed artifact until the wave 7-10 migrations" rule, gated
# by the merge-blocking parse->merge equality test. Authoring these on the
# group would change THEIR resolved config too. The variants themselves are
# tier-agnostic and reusable — only this attachment is host-scoped.
#
# Reproduces the pre-wipe inventory of len-serv-003
# (docs/len-serv-003-preflight-inventory-2026-07-30.md) minus landscape-client,
# which is deliberately not carried forward.
applications:
  # Cockroach flags come from CockroachSpec defaults, which are the
  # len-serv-001/002 form (port-only listen/sql, path=/...,attrs=ssd,size=.5).
  # 003 previously drifted to IP-bound listen/sql and a bare store path.
  - kind: cockroach
    seed_ip: 172.16.3.92
    locality: region=us,cluster-unit=lenovo

  # Installed but left DISABLED, matching the fleet's actual state as of
  # 2026-07-28. Set enabled: true only when the rollout agent is meant to run.
  - kind: cockroach-rollout-agent
    binary-url: http://172.16.2.30:25000/api/artifacts/cockroach-rollout-agent
    enabled: false
    # database-url stays REPLACE_AT_PLACE_TIME and is substituted at place
    # time — the live env file is marked "Host-local; do not commit".

  - kind: prometheus-node-exporter

  # key stays REPLACE_AT_PLACE_TIME: the snap installs, but `canonical-livepatch
  # enable` is skipped until a real token is substituted at place time.
  - kind: canonical-livepatch

  - kind: report-status

  - kind: zsh
    user: jdfalk
